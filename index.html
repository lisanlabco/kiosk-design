<style>
/* VOICE: 工業設計提案，安靜、精準，像產品發表前的內部看樣
   IDEA: 白色攝影棚裡的一張轉台，三台機器輪流上台
   PICTURE: 可拖曳旋轉的3D概念機，佔滿首屏大半
   COLOUR and TYPE: 暖灰棚景、墨色字，深青綠只用在選中狀態；Noto Sans TC
   LAYOUT: 上方切換三款，棚景在前，規格與配色在下（寬螢幕在右） */
:root{color-scheme:light;--bg:#f4f6f5;--stage:#e4eae8;--hi:#ffffff;--ink:#1d2523;--mute:#5f6b68;--line:#d5dddb;--card:#ffffff;--acc:#007d7d;--accd:#006666;--red:#e60012;--grn:#009944;--org:#eb603a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;overflow-x:clip}
header{max-width:1240px;margin:auto;padding:22px max(5vw,16px) 12px}
h1{font-size:clamp(24px,4.6vw,38px);line-height:1.12;margin:0 0 6px;font-weight:700;text-wrap:balance;color:var(--accd)}
.lead{color:var(--mute);margin:0;max-width:62ch}
main{max-width:1240px;margin:auto;padding:0 max(5vw,16px) 36px;display:grid;gap:14px}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}.tabs{grid-column:1/-1}}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:52px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;line-height:1.2}
.tab b{font-weight:700;margin-right:5px}
.tabs{gap:6px;overflow-x:auto;scrollbar-width:none}.tab{padding:0 2px;flex:1 0 auto;min-width:50px}
@media(max-width:480px){.tab{font-size:15px}.tab b{display:block;margin:0 0 2px}}
.tab[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab:focus-visible,.chip:focus-visible,.sw button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pip{position:absolute;z-index:2;border:2px solid var(--acc);border-radius:14px;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}.pip[hidden]{display:none}.pip span{position:absolute;left:10px;top:8px;font-size:13px;font-weight:500;background:var(--acc);color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap}
.stage{position:relative;height:clamp(390px,64vh,700px);border-radius:20px;background:radial-gradient(110% 85% at 50% 28%,var(--hi),var(--stage));overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:15px}
.figwrap{display:grid;gap:10px}
.ctrl{display:flex;flex-direction:column;gap:10px}.ctrl>*{flex:none}.ctrl .bar{gap:6px}
@media(max-width:899px){
 html,body{height:100%}
 body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
 header{padding:10px 16px 6px;width:100%}h1{font-size:19px;margin:0 0 2px}.lead{font-size:13px}
 main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:8px;padding:0 12px}
 .tab{min-height:42px}
 .figwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
 .stage{flex:0 0 auto;height:44vh;height:44dvh}
 .ctrl{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 0 20px;border-top:1px solid var(--line)}
 .bar{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 .bar::-webkit-scrollbar{display:none}.bar .chip{flex:none}
 #sliders{flex-wrap:wrap!important;overflow:visible}.tiltw{flex:1 1 100%}
 .info{padding:12px 14px 14px}.info h2{font-size:18px;margin-bottom:4px}
 .pip span{font-size:11px;left:6px;top:6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
}
.bar{display:flex;flex-wrap:wrap;gap:6px}.bar[hidden]{display:none}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip[hidden]{display:none}
.tiltw{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:15px;flex:1 1 260px}.tiltw[hidden]{display:none}.tiltw input{flex:1;accent-color:var(--acc);min-height:32px}.tiltw output{min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 22px}
.info h2{font-size:26px;line-height:1.15;margin:0 0 8px}
.info .idea{margin:0 0 16px}
dl{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px 12px;margin:0 0 18px;font-size:15px}
dt{color:var(--mute)}dd{margin:0}
.swl{font-size:14px;color:var(--mute);margin:0 0 8px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 5px;border-radius:24px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:32px;height:32px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.note{font-size:13px;color:var(--mute);margin:16px 0 0}
</style>

<header>
<h1>智慧自助機款式（桌上型）設計提案</h1>
<p class="lead">拖曳旋轉、滾輪或雙指縮放，右鍵或雙指拖曳可平移；點兩下可聚焦該處。</p>

</div>
<div class="bar" id="varbar" hidden></div>
<div class="bar" id="sliders" hidden></div>
</div>
</div>
<section class="info" id="info" aria-live="polite"></section>
</main>
